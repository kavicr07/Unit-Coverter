<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="unit.css">
    </head>
    <body>
        <div id="head">
            <h1>METRIC UNIT CONVERSION</h1>
            <input id="input-el" type="text" placeholder="0">
            <button id="convert-btn">CONVERT</button>
            <button id="reset-btn">RESET</button>
        </div>
        <div id="project">
            <div id="section-L">
                <h3>Length (Meeter/Feet)</h3>
                <p id="length-el">0 Meter = 0000 Feet | 0 Feet = 0000 Meter</p>
            </div>
            <div id="section-V">
                <h3>Volume (Liters/Galoons)</h3>
                <p id="volume-el">0 liters = 0000 galoons | 0 galoons = 0000 liters</p>
            </div>
            <div id="section-M">
                <h3>Mass (Kilograms/Pounds)</h3>
                <p id="mass-el">0 Kilograms = 0000 Pounds | 0 Pounds = 0000 Kilograms</p>
            </div>
        </div>
        <script src="unit.js"></script>
    </body>
</html>
